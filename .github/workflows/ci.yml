name: ci

on:
  push:
    branches:
      - 'main'
      - 'next'
      - 'feature/*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'
      - 'next'
permissions:
  actions: read
  checks: read
  contents: read
  deployments: read
  id-token: none
  issues: write
  discussions: none
  packages: none
  pages: none
  pull-requests: write
  repository-projects: none
  security-events: none
  statuses: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
        with:
          clean: 'false'
          fetch-depth: '0'
      - name: Fetch all history for all tags and branches
        run: |
          git fetch --prune
      - name: 🔨 Use .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.101'
      - name: 🎁 dotnet tool restore
        run: |
          dotnet tool restore
      - name: 🎁 Restore
        id: restore
        run: |
          dotnet nuke Restore --skip
      - name: ⚙ Build
        id: build
        run: |
          dotnet nuke Build --skip
      - name: 🚦 Test
        id: test
        run: |
          dotnet nuke Test TriggerCodeCoverageReports GenerateCodeCoverageReportCobertura GenerateCodeCoverageBadges GenerateCodeCoverageSummary GenerateCodeCoverageReport --skip
      - name: 📦 Pack
        id: pack
        run: |
          dotnet nuke Pack --skip
      - name: Git Hub Actions
        id: gitHubActions
        run: |
          dotnet nuke GitHubActions --skip
      - name: 🐿 Publish Coverage
        uses: codecov/codecov-action@v3.1.6
        with:
          name: 'actions-${{ matrix.os }}'
      - name: 🏺 Publish logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'logs'
          path: 'artifacts/logs/'
      - name: 🏺 Publish coverage data
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'coverage'
          path: 'coverage/'
      - name: 🏺 Publish test data
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'test data'
          path: 'artifacts/test/'
      - name: 🏺 Publish NuGet Packages
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'nuget'
          path: 'artifacts/nuget/'
  changes:
    outputs:
      filterApple: '${{ steps.filter.outputs.apple }}'
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
        with:
          clean: 'false'
      - name: Detect apple changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: '.github/apple-filter.yml'
  build-apple:
    needs:
      - changes
    if: ${{ !cancelled() && (needs.changes.outputs.filterApple == 'true' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') }}
    runs-on: [windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
        with:
          clean: 'false'
          fetch-depth: '0'
      - name: Fetch all history for all tags and branches
        run: |
          git fetch --prune
      - name: 🔨 Use .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.101'
      - name: 🎁 dotnet tool restore
        run: |
          dotnet tool restore
      - name: Workloads
        run: |
          dotnet nuke Workloads --skip
      - name: 🎁 Restore
        run: |
          dotnet nuke Restore --skip --solution Apple.sln
      - name: ⚙ Build
        run: |
          dotnet nuke Build --skip --solution Apple.sln
      - name: 📦 Pack
        run: |
          dotnet nuke Pack --skip --solution Apple.sln
      - name: 🏺 Publish Apple NuGet Package
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'nuget-apple'
          path: 'artifacts/nuget/Rocket.Surgery.Airframe.Apple.*'
